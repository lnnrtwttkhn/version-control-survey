intro_note:
  class: |
    answer_below_label
    label_align_left
  type: note
  name: intro_note
  label: |
    ###  Version Control
version_control:
  type: textarea
  class: |
    answer_below_label
    big-textarea
  name: version_control
  label: |
    In your own words: Can you briefly define the term **version control**?
    Please refrain from looking up an answer online.
  optional: "*"
collaboration:
  type: textarea
  class: |
    answer_below_label
    big-textarea
  name: collaboration
  label: |
    Please briefly describe your **typical workflow for collaboration**, i.e., when you work together with others on research projects.
    How do you work collaboratively on manuscripts, programming code, or research data?
    Which tools are involved, and how would you evaluate the effectiveness of the collaborative workflow?
  optional: "*"
scenario_1:
  type: textarea
  class: |
    answer_below_label
    big-textarea
  name: scenario_1
  label: |
    Imagine a scenario where you crafted a brilliant paragraph for a manuscript (for example, your paper, thesis, or report), but then accidentally ruined it.
    **How would you retrieve the earlier brilliant version?** Is it even possible?
  optional: "*"
scenario_2:
  type: textarea
  class: |
    answer_below_label
    big-textarea
  name: scenario_2
  label: |
    Consider a situation where you are working with five co-authors on a paper.
    **How do you handle the changes and comments they make to the document?**
    If you’re using LibreOffice Writer or Microsoft Word and you accept changes made using the "Track Changes" option, **what happens to the history of those modifications?**
  optional: "*"
submit:
  type: submit
  name: submit
  label: |
    Submit and close survey
